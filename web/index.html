    /* Inlined style.css for PageSpeed optimization */
    html,

      margin: 0;

      height: 100%;

      overflow: hidden;
      background-color: #fff

    body.theme-dark {

    .preloader {
      position: fixed;
      inline-size: 100%;
      block-size: 100%;
      background-color: #fff;
      display: grid;
      place-items: center

    .theme-dark .preloader {

    @media (max-width:1199px) {

        display: none

    }

    .preloader-img {
      animation: animloaderimg 3000ms ease-in-out infinite
    }

    .preloader-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center
    }

    .preloader .loader {
      width: 140px;
      height: .25rem;
      display: inline-block;
      position: relative;
      background: rgba(0, 0, 0, .15);
      overflow: hidden;
      border-radius: 50rem
    }

    .theme-dark .preloader .loader {
      background: rgba(255, 255, 255, .15)
    }

    .preloader .loader::after {
      content: "";
      width: 30px;
      height: 4.8px;
      background: #000;
      position: absolute;
      top: 0;
      left: 0;
      box-sizing: border-box;
      animation: animloader 2e3ms linear infinite;
      border-radius: 50rem
    }

    .header {
      position: fixed;
      inset-block-start: 0;
      inset-inline-start: 0;
      inline-size: 100%
    }

    .header-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.28rem 1.6rem;
      background-color: #fff;
      box-shadow: 0 6px 12px -3px rgba(4, 97, 165, .1);
      border-radius: 0 0 .625rem .625rem
    }

    .theme-dark .header-container {
      background-color: #111
    }

    .header .logo {
      max-height: 30px
    }

    .placeholder {
      block-size: .825rem;
      inline-size: 3rem;
      background-color: #f5f5f5;
      border-radius: .3rem
    }

    .theme-dark .placeholder {
      background-color: #111

    .placeholder-wide {

    .d-flex {
      display: flex
    }

    .align-items-center {
      align-items: center
    }

    .justify-content-center {
      justify-content: center
    }

    .justify-content-between {
      justify-content: space-between
    }

    .flex-column {
      flex-direction: column
    }

    .gap-3 {
      gap: 1rem
    }

    .gap-4 {
      gap: 1.5rem
    }

    .gap-5 {
      gap: 3rem
    }

    @keyframes animloader {
      0% {
        left: 0;
        transform: translateX(-100%)
      }

      100% {
        left: 100%;
        transform: translateX(0)
      }
    }

    @keyframes animloaderimg {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-1rem)
      }
    }

  <script>
    window.addEventListener('load', function () {
      document.querySelectorAll("img.svg").forEach(function (img) {
        var imgID = img.getAttribute("id");
        var imgClass = img.getAttribute("class");
        var imgURL = img.getAttribute("src");
        var xhr = new XMLHttpRequest();
        xhr.open("GET", imgURL, true);
        xhr.responseType = "document";
        xhr.onload = function () {
          if (xhr.status === 200) {
            var data = xhr.response;
            var svg = data.querySelector("svg");
            if (svg) {
              if (typeof imgID !== "undefined") svg.setAttribute("id", imgID);
              if (typeof imgClass !== "undefined") svg.setAttribute("class", imgClass + " replaced-svg");
              svg.removeAttribute("xmlns:a");
              if (!svg.getAttribute("viewBox") && svg.getAttribute("height") && svg.getAttribute("width")) {
                svg.setAttribute("viewBox", "0 0 " + svg.getAttribute("height") + " " + svg.getAttribute("width"));
              }
              img.parentNode.replaceChild(svg, img);
            }
          }
        };
        xhr.send();
      });
    });
  </script>

  <script>
    // Robust preloader removal
    var observer = new MutationObserver(function (mutations) {
      if (document.body.querySelector('flt-glass-pane') || 
          document.body.querySelector('flutter-view') || 
          document.body.querySelector('flt-scene-host')) {
        hidePreloader();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    function hidePreloader() {
        var preloader = document.querySelector('.preloader');
        if (preloader) {
          preloader.style.zIndex = '-1';
          setTimeout(function() { preloader.style.display = 'none'; }, 500);
          if(typeof observer !== 'undefined') observer.disconnect();
        }
    }

    // Increased timeout for slow mobile loads
    setTimeout(function () {
      hidePreloader();
    }, 30000);

    // Global error listener to help debug blank pages
    window.addEventListener('error', function (event) {
      if (event.filename && (event.filename.indexOf('main.dart.js') > -1 || event.filename.indexOf('flutter_bootstrap.js') > -1)) {
        console.error("Critical Flutter Web Script Error:", event);
        // Uncomment below to show error on device for debugging
        // alert("Error loading app script: " + event.message);
      }
    }, true);
  </script>
